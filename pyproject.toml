[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mist"
version = "0.1.0"
description = "Multi-modal Intelligent Service Technician - AI-powered automotive diagnostics"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }

[project.optional-dependencies]
scraper = [
    "scrapy>=2.11.0",
]

[project.scripts]
mist = "src.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scrapers*"]
