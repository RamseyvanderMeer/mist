[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mist"
version = "0.1.0"
description = "Multi-modal Intelligent Service Technician - AI-powered automotive diagnostics"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }

[project.optional-dependencies]
scraper = [
    "scrapy>=2.11.0",
]
dev = [
    "lefthook>=1.10.0",
    "ruff>=0.9.0",
]

[project.scripts]
mist-cli = "src.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scrapers*"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".venv",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".tox",
    ".pi",
    "node_modules",
    "build",
    "dist",
    "**/._*",
    "tests/e2e",
]

[tool.ruff.lint]
select = ["E", "F"]
# Line length is enforced gradually; staged-file checks still catch real bugs (F*, most E*).
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
