name: Deploy MIST API to Cloud Run

# NOTE: This workflow triggers on every push to main.
# To avoid Cloud Build costs, work on feature branches and only merge to main when ready to deploy.
# Feature branch pattern: git checkout -b feature/my-feature

on:
  push:
    branches: [ main ]
  # pull_request triggers removed to avoid duplicate builds
  # Only deploy on merge to main, not on PR creation/update

env:
  PROJECT_ID: mist-487607
  REGION: us-west1
  SERVICE_NAME: mist-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Google Auth
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/33176763769/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'github-actions-v2@mist-487607.iam.gserviceaccount.com'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Build and Push Container
      run: |
        # Start async build with latest tag
        BUILD_ID=$(gcloud builds submit --async --tag gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:latest . --format='value(id)')
        echo "Started build: $BUILD_ID"
        
        # Poll for build completion
        echo "Waiting for build to complete..."
        for i in {1..90}; do
          STATUS=$(gcloud builds describe $BUILD_ID --format='value(status)')
          echo "Build status: $STATUS"
          if [ "$STATUS" = "SUCCESS" ]; then
            echo "Build completed successfully!"
            break
          elif [ "$STATUS" = "FAILURE" ] || [ "$STATUS" = "CANCELLED" ] || [ "$STATUS" = "EXPIRED" ]; then
            echo "Build failed with status: $STATUS"
            exit 1
          fi
          sleep 10
        done

    - name: Deploy to Cloud Run
      id: deploy
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: ${{ env.SERVICE_NAME }}
        region: ${{ env.REGION }}
        image: gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:latest
        flags: |
          --memory=2Gi
          --cpu=1
          --concurrency=80
          --max-instances=3
          --min-instances=0
          --service-account=mist-api-sa@mist-487607.iam.gserviceaccount.com
          --set-secrets=DATABASE_URL=mist-database-url:latest,SAMBANOVA_API_KEY=mist-sambanova-api-key:latest,CHROMADB_API_KEY=mist-chromadb-api-key:latest,CHROMADB_TENANT=mist-chromadb-tenant:latest,REDIS_URL=mist-redis-url:latest
          --timeout=300

    - name: Show Output
      run: echo "${{ steps.deploy.outputs.url }}"

    - name: Health Check
      run: |
        sleep 10
        curl -f ${{ steps.deploy.outputs.url }}/health || exit 1
