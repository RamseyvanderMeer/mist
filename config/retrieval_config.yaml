# Retrieval Configuration
# Configures the multi-stage retrieval pipeline for repair guide recommendations

# Vector store configuration (ChromaDB Cloud)
vector_store:
  provider: chromadb
  collection_name: repair_guides_enhanced
  database: mist
  distance_metric: cosine  # cosine, euclidean, dot
  vector_size: 1024  # Must match embedding output_dimension

  # ChromaDB Cloud: set in .env
  #   CHROMA_DB_API_KEY=your-api-key
  #   CHROMA_DB_TENANT=your-tenant-id

# Multi-stage retrieval parameters
retrieval:
  initial_k: 100  # Initial candidates from vector search (Stage 1)
  rerank_k: 50  # Candidates after re-ranking (Stage 2)
  final_k: 10  # Final number of recommendations returned (Stage 4)
  min_similarity: 0.5  # Minimum cosine similarity threshold for initial retrieval

reranking:
  enabled: true  # Enable re-ranking stage in retrieval pipeline
  provider: local  # cohere or local - reranking provider selection
  model: cross-encoder/ms-marco-MiniLM-L-12-v2  # Local cross-encoder model (HuggingFace)
  top_k: 50  # Number of documents to re-rank (from initial_k candidates)
  
  # Alternative: Cohere API reranking (requires API key)
  # Uncomment below and set provider: cohere to use Cohere API:
  # provider: cohere
  # model: rerank-english-v3.0  # Cohere rerank model
  # api_key_env: COHERE_API_KEY  # Environment variable name for API key

# Combined ranking weights (must sum to 1.0)
# Final score = embedding_similarity * embedding_score + rerank_score * rerank_value + ...
# When DATABASE_URL is set, weights are loaded from ranking_weights table (overrides this section).
ranking:
  embedding_similarity: 0.4  # Weight for vector similarity score
  rerank_score: 0.3  # Weight for re-ranking score
  kg_path_score: 0.2  # Weight for knowledge graph path score
  feedback_score: 0.1  # Weight for historical feedback score

# Knowledge graph configuration
# Used for path-based scoring and explainability
knowledge_graph:
  enabled: true  # Enable knowledge graph filtering and scoring
  graph_path: data/knowledge_graph.graphml  # Path to NetworkX graph file
  max_path_length: 3  # Maximum path length for fault → repair procedure paths
  min_path_score: 0.3  # Minimum path score threshold

# Clarification question generation
# Controls when and how clarification questions are asked
clarification:
  enabled: true  # Enable clarification question generation
  ambiguity_threshold: 0.65  # Top score threshold below which clarification is triggered
  score_variance_threshold: 0.02  # Score variance threshold for ambiguity detection
  max_questions: 3  # Maximum number of clarification questions per query
  max_clarifications_per_session: 3  # Maximum clarification rounds per session
