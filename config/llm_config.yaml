# LLM Provider Configuration
# Configures LLM providers for clarification questions and query expansion

# Provider selection and fallback order
providers:
  primary: gemini  # Primary LLM provider to use
  fallback:  # Fallback providers in order (used if primary fails)
    - anthropic
    - open_source
    - openai

# OpenAI provider configuration
openai:
  model: gpt-4o  # OpenAI model identifier
  api_key_env: OPENAI_API_KEY  # Environment variable name for API key
  temperature: 0.7  # Sampling temperature (0.0-2.0)
  max_tokens: 1000  # Maximum tokens in response
  timeout: 30  # Request timeout in seconds

# Anthropic (Claude) provider configuration
anthropic:
  model: claude-3-5-sonnet-20241022  # Anthropic model identifier
  api_key_env: ANTHROPIC_API_KEY  # Environment variable name for API key
  temperature: 0.7  # Sampling temperature (0.0-1.0)
  max_tokens: 1000  # Maximum tokens in response
  timeout: 30  # Request timeout in seconds

# Google Gemini provider configuration
gemini:
  model: gemini-pro  # Gemini model identifier (can be overridden by GEMINI_MODEL env var)
  api_key_env: GEMINI_API_KEY  # Environment variable name for API key
  temperature: 0.7  # Sampling temperature (0.0-2.0)
  max_tokens: 1000  # Maximum tokens in response
  timeout: 30  # Request timeout in seconds

# Open-source provider configuration (Ollama)
open_source:
  provider: ollama  # Local LLM provider (Ollama)
  model: llama3.1:70b  # Model name/tag in Ollama
  base_url: http://localhost:11434  # Ollama server URL
  temperature: 0.7  # Sampling temperature
  max_tokens: 1000  # Maximum tokens in response

# Prompt templates for LLM tasks
prompts:
  # Clarification question generation prompt
  clarification:
    system: |
      You are a diagnostic assistant helping to clarify automotive fault diagnosis.
      Analyze the fault codes and OBD data, then ask 1-3 clarifying questions
      to help narrow down the diagnosis.
      
      Focus on:
      - Missing critical information
      - Ambiguous symptoms
      - Vehicle-specific context
      
      Return only the questions, numbered or bulleted.
    
    user_template: |
      Fault Codes: {fault_codes}
      OBD Data: {obd_data}
      Top Recommendations: {top_candidates}
      
      Generate clarifying questions to improve diagnosis accuracy.
  
  # Query expansion prompt (for refining queries with user responses)
  query_expansion:
    system: |
      You are a query expansion assistant for automotive diagnostics.
      Expand the original query with context from user responses.
    
    user_template: |
      Original Query: {original_query}
      User Responses: {user_responses}
      
      Expand the query with relevant context.

  # Symptom expansion: bridge symptom descriptions to repair/fix terminology
  # e.g. "engine too hot" -> "overheating, coolant, radiator, thermostat"
  symptom_expansion:
    system: |
      You are an automotive diagnostic expert. Given a symptom description, output a short
      comma-separated phrase of related terms for semantic search: causes, components,
      and typical repairs. This helps match symptom descriptions (e.g. "engine too hot")
      to repair procedures (e.g. "radiator replacement").
      Output ONLY the comma-separated phrase, no explanation.
    user_template: |
      Symptom: {symptom}
      
      Related causes, components, and repairs (comma-separated):
