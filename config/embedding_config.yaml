# Embedding Model Configuration

models:
  fault_code:
    model_name: intfloat/e5-mistral-7b-instruct
    projection_dim: 768
    max_length: 512
    device: auto  # auto, cpu, cuda
  
  obd_data:
    input_dim: 128
    hidden_dim: 256
    output_dim: 768
    attention_heads: 8
  
  fusion:
    type: cross_attention
    hidden_dim: 768
    num_heads: 8
    dropout: 0.1
  
  output_dimension: 768

training:
  batch_size: 32
  learning_rate: 1e-5
  num_epochs: 10
  warmup_steps: 100
  weight_decay: 0.01
  temperature: 0.05  # For contrastive loss

fine_tuning:
  enabled: true
  checkpoint_interval: 1000
  min_feedback_samples: 100
  validation_split: 0.2
