# Training Configuration
# Hyperparameters and settings for embedding fine-tuning and self-improvement

# Data source for training (db = scraped_records from Neon, feedback = SQLite sessions)
data_source:
  default: db  # db | feedback | both
  scraped_min_confidence: 0.7
  scraped_outcomes: ["success", "partial"]

# Training hyperparameters for contrastive learning
training:
  batch_size: 32  # Batch size for training
  learning_rate: 1e-5  # Learning rate for optimizer
  num_epochs: 10  # Number of training epochs
  warmup_steps: 100  # Learning rate warmup steps
  weight_decay: 0.01  # L2 regularization weight
  temperature: 0.05  # Temperature parameter for contrastive loss (InfoNCE)
  gradient_accumulation_steps: 1  # Accumulate gradients over N steps before update

# Fine-tuning configuration
# Controls automatic fine-tuning from user feedback
fine_tuning:
  enabled: true  # Enable automatic fine-tuning
  checkpoint_interval: 1  # Save checkpoint after N epochs (1 = every epoch)
  min_feedback_samples: 10  # Minimum feedback samples required before training starts
  validation_split: 0.2  # Fraction of data to use for validation (0.0-1.0)
  early_stopping_patience: 3  # Stop training if validation loss doesn't improve for N epochs

# Reward model configuration (for RLHF)
# Neural network that predicts feedback scores from embeddings
reward_model:
  input_dim: 768  # Input dimension (embedding size)
  hidden_dim: 512  # Hidden layer dimension
  learning_rate: 1e-4  # Learning rate for reward model training

# Active learning configuration
# Identifies uncertain cases for human review and feedback collection
active_learning:
  enabled: true  # Enable active learning pipeline
  uncertainty_threshold: 0.65  # Score threshold below which cases are flagged as uncertain
  score_variance_threshold: 0.02  # Variance threshold below which scores are considered too similar (ambiguous)
  entropy_threshold: null  # Entropy threshold above which scores are considered too uniform (null = auto-calculate as 0.8 * max_entropy)
  top_n_for_analysis: 3  # Number of top candidates to analyze for variance and entropy calculations
  batch_size: 10  # Number of uncertain cases to collect per batch
  sampling_strategy: uncertainty  # Sampling strategy: uncertainty, random, diversity
