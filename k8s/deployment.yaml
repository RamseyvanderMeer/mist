apiVersion: apps/v1
kind: Deployment
metadata:
  name: mist-api
  labels:
    app: mist-api
spec:
  replicas: 2  # Start with 2 for redundancy
  selector:
    matchLabels:
      app: mist-api
  template:
    metadata:
      labels:
        app: mist-api
    spec:
      containers:
      - name: mist-api
        image: gcr.io/PROJECT_ID/mist-api:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: mist-secrets
              key: database-url
        - name: SAMBANOVA_API_KEY
          valueFrom:
            secretKeyRef:
              name: mist-secrets
              key: sambanova-api-key
        - name: CHROMA_DB_API_KEY
          valueFrom:
            secretKeyRef:
              name: mist-secrets
              key: chromadb-api-key
        - name: CHROMA_DB_TENANT
          valueFrom:
            secretKeyRef:
              name: mist-secrets
              key: chromadb-tenant
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mist-api-service
spec:
  selector:
    app: mist-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mist-api-ingress
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "mist-api-ip"
    networking.gke.io/managed-certificates: "mist-api-cert"
spec:
  rules:
  - host: api.mist.example.com  # Change to your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mist-api-service
            port:
              number: 80
